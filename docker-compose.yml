version: '3.8'

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — Cơ sở dữ liệu chính
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: poitour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poitour
      POSTGRES_USER: poitour
      POSTGRES_PASSWORD: poitour123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poitour -d poitour"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — Cache GEO + Cooldown
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: poitour-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO — Lưu trữ file audio .mp3
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: poitour-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # MinIO Setup — Tự động tạo bucket "audio-files"
  # Chạy 1 lần rồi tự thoát
  # ─────────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: poitour-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb local/audio-files --ignore-existing;
      /usr/bin/mc policy set download local/audio-files;
      echo '✅ Bucket audio-files đã được tạo!';
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
