services:

  # ─────────────────────────────────────────────
  # PostgreSQL — Cơ sở dữ liệu chính
  # Đổi port máy thật sang 5433 để tránh đụng độ Postgres có sẵn trên máy
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: poitour-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: poitour
      POSTGRES_USER: poitour
      POSTGRES_PASSWORD: poitour123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poitour -d poitour"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — Cache GEO + Cooldown
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: poitour-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
