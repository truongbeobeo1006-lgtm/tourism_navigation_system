server:
  port: 8082

spring:
  application:
    name: poi-service

  datasource:
    url: jdbc:postgresql://localhost:5432/poitour
    username: poitour
    password: poitour123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
